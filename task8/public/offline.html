<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#241811" />
    <title>Offline — Quest Board</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <!-- This page is precached by the service worker, so it opens without internet.
         All styles are inside the file: it does not need the app's JavaScript. -->
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 24px 16px;
        background: #241811 radial-gradient(circle at 20% 0%, #3a281a 0%, #241811 55%);
        color: #f3e6c8; font-family: "Inter", "Segoe UI", system-ui, sans-serif; line-height: 1.55;
      }
      .card {
        width: 100%; max-width: 460px; text-align: center;
        background: #f3e6c8; color: #3a2a1a; border-radius: 10px; border-top: 4px solid #b8452f;
        padding: 28px 22px 24px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      }
      img { width: 84px; height: 84px; border-radius: 18px; }
      h1 { font-family: "Cinzel", Georgia, serif; font-size: 1.5rem; margin: 14px 0 8px; line-height: 1.3; }
      p { margin: 0 0 12px; color: #6b5a44; }
      ul { text-align: left; margin: 0 0 18px; padding-left: 20px; color: #6b5a44; font-size: 0.92rem; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      .btn {
        min-height: 44px; padding: 10px 18px; border-radius: 6px;
        font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer; text-decoration: none;
        display: inline-flex; align-items: center; justify-content: center;
        background: #c9973b; color: #1c1208; border: 1px solid transparent;
      }
      .btn-ghost { background: transparent; color: #3a2a1a; border-color: rgba(122, 90, 28, 0.6); }
      .btn:disabled { opacity: 0.6; cursor: wait; }
      .btn:focus-visible { outline: 3px solid #c9973b; outline-offset: 2px; }
      .status { min-height: 1.5em; margin: 14px 0 0; font-size: 0.9rem; font-weight: 600; color: #b8452f; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>This page could not be loaded because there is no internet connection.</p>
      <ul>
        <li>Pages you opened before still work offline.</li>
        <li>Quests and monsters you already viewed are saved on this device.</li>
        <li>New pages will load as soon as you are back online.</li>
      </ul>
      <div class="actions">
        <button type="button" class="btn" id="retry">Retry Connection</button>
        <a class="btn btn-ghost" href="/">Go to Home</a>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
      const retryButton = document.getElementById("retry");
      const statusText = document.getElementById("status");

      // The address of the page the user wanted. On /offline itself we go Home.
      function targetPage() {
        const onOfflinePage = location.pathname === "/offline" || location.pathname === "/offline.html";
        return onOfflinePage ? "/" : location.href;
      }

      // navigator.onLine is not enough (it can be true without real internet),
      // so we send a real request. It skips every cache, so it only works with a connection.
      async function hasConnection() {
        try {
          const response = await fetch("/manifest.json?ping=" + Date.now(), { cache: "no-store" });
          return response.ok;
        } catch {
          return false;
        }
      }

      async function retry() {
        retryButton.disabled = true;
        statusText.textContent = "Checking the connection...";
        if (await hasConnection()) {
          location.href = targetPage();
          return;
        }
        statusText.textContent = "Still offline. Check your Wi-Fi or mobile data and try again.";
        retryButton.disabled = false;
      }

      retryButton.addEventListener("click", retry);
      // The connection came back by itself: try to open the page again
      window.addEventListener("online", retry);
    </script>
  </body>
</html>
