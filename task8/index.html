<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Quest Board — browse fantasy guild quests and a monster bestiary. Works offline." />
    <title>Quest Board — Aidana Shynbulatova</title>

    <!-- PWA: manifest, theme color and icons -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#241811" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Quest Board" />

    <!-- crossorigin: the service worker can cache the fonts and use them offline -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Quest Board needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
